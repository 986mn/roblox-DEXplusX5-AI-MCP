<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#196c2e"/>
    </linearGradient>
  </defs>

  <rect width="960" height="300" fill="url(#bg)"/>

  <!-- 装饰网格 -->
  <g stroke="#21262d" stroke-width="1" opacity="0.6">
    <line x1="0" y1="75" x2="960" y2="75"/>
    <line x1="0" y1="150" x2="960" y2="150"/>
    <line x1="0" y1="225" x2="960" y2="225"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="480" y1="0" x2="480" y2="300"/>
    <line x1="720" y1="0" x2="720" y2="300"/>
  </g>

  <!-- 主标题 -->
  <text x="480" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="52" font-weight="800" fill="#f0f6fc">
    roblox-DEX<tspan fill="url(#accent)">plusX5</tspan>-AI-MCP
  </text>

  <!-- 副标题 -->
  <text x="480" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#8b949e">
    DEX PlusPlusPlusPlus ↔ AI/MCP 双向桥接
  </text>

  <!-- 徽章行 -->
  <g font-family="system-ui,sans-serif" font-size="14">
    <rect x="240" y="185" rx="12" width="110" height="26" fill="#1f6feb" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
    <text x="295" y="203" text-anchor="middle" fill="#58a6ff">Luau</text>

    <rect x="365" y="185" rx="12" width="130" height="26" fill="#1f6feb" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
    <text x="430" y="203" text-anchor="middle" fill="#58a6ff">TypeScript</text>

    <rect x="510" y="185" rx="12" width="90" height="26" fill="#238636" opacity="0.2" stroke="#7ee787" stroke-width="1"/>
    <text x="555" y="203" text-anchor="middle" fill="#7ee787">MCP</text>

    <rect x="615" y="185" rx="12" width="110" height="26" fill="#238636" opacity="0.2" stroke="#7ee787" stroke-width="1"/>
    <text x="670" y="203" text-anchor="middle" fill="#7ee787">11 tools</text>
  </g>

  <!-- 底部说明 -->
  <text x="480" y="255" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#484f58">
    A · B · C · AC · BC — 五种形态，从纯 API 到完整 UI
  </text>
</svg>